<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>AI Quote Generator</title>
     <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    
</head>
<body>
  <header>
      <h1>AI Quote Generator</h1>
      <p>Spark a thought in a cosmic pulse</p>
    </header>

    <!-- Main Generator Container -->
    <main>
      <form id="quote-form">
        <input
          id="topic"
          type="text"
          placeholder="Enter a mood or topic (e.g., courage, rain, morning)..."
          autofocus
          required
          autocomplete="off"
        />
        <button type="submit" id="submit-btn">Generate Quote</button>
      </form>

      <div class="quote-display">
        <p id="quote-text">What would you like an original quote about?</p>
        <p id="quote-author"></p>
      </div>
    </main>

    <!-- Footer Area -->
    <footer>
      This AI project was coded by
      <a href="https://github.com/matthieua/" target="_blank">Sheron Ndimande</a>, 
      open-sourced on <a href="https://github.com/shecodesio/french-poem-generator" target="_blank">GitHub</a>, 
      and hosted on <a href="https://ai-french-poem-generator.netlify.app/" target="_blank">Netlify</a>.
    </footer>

</body>
</html>
